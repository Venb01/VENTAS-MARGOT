<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d2140">
<title>Sistema de Ventas e Inventario</title>
<style>
:root{--bg:#f3f5fa;--card:#fff;--ink:#1c2033;--mut:#667085;--line:#e3e7ef;--dark:#1d2140;--dark2:#2b3060;--ac:#3f5bd8;--ac2:#2f46b0;--ok:#2b9348;--warn:#e8890c;--bad:#d62839;--rad:12px}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:15px}
h1,h2,h3{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
#app{display:flex;min-height:100vh}
#menu{width:240px;background:var(--dark);color:#cfd4f0;display:flex;flex-direction:column;position:fixed;top:0;bottom:0;left:0;z-index:50;transition:transform .2s}
#menu .marca{padding:20px 18px;font-weight:700;font-size:18px;color:#fff;border-bottom:1px solid rgba(255,255,255,.08);line-height:1.2}
#menu .marca small{display:block;font-weight:400;color:#9aa2d6;font-size:12px;margin-top:4px}
#menu nav{flex:1;overflow:auto;padding:10px 8px}
#menu a{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:9px;color:#cfd4f0;text-decoration:none;cursor:pointer;margin-bottom:2px}
#menu a:hover{background:rgba(255,255,255,.07)}
#menu a.act{background:var(--ac);color:#fff}
#menu .pie{padding:12px 16px;font-size:12px;color:#8d95c9;border-top:1px solid rgba(255,255,255,.08)}
.ic{width:20px;height:20px;flex:none}
#main{flex:1;margin-left:240px;min-width:0;display:flex;flex-direction:column}
#topbar{display:flex;align-items:center;gap:12px;background:var(--card);border-bottom:1px solid var(--line);padding:12px 18px;position:sticky;top:0;z-index:20}
#topbar h2{font-size:18px;flex:1}
#btnMenu{display:none;background:none;border:0;padding:4px;cursor:pointer}
#estadoRed{font-size:12px;padding:4px 10px;border-radius:99px;background:#e6f6ea;color:var(--ok);font-weight:600}
#estadoRed.off{background:#fff1e0;color:var(--warn)}
#contenido{padding:18px;flex:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--rad);padding:16px;margin-bottom:14px}
.card h3{font-size:16px;margin-bottom:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid transparent;border-radius:9px;padding:9px 14px;cursor:pointer;font-weight:600;background:var(--dark);color:#fff}
.btn:hover{filter:brightness(1.12)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn.pri{background:var(--ac)}
.btn.sec{background:#fff;color:var(--ink);border-color:var(--line)}
.btn.ok{background:var(--ok)}
.btn.bad{background:var(--bad)}
.btn.xs{padding:5px 9px;font-size:13px;border-radius:7px}
.btn.grande{width:100%;padding:14px;font-size:17px}
input,select,textarea{width:100%;padding:9px 11px;border:1px solid #cfd5e3;border-radius:9px;background:#fff}
input:focus,select:focus,textarea:focus{outline:2px solid rgba(63,91,216,.35);border-color:var(--ac)}
label{display:block;font-size:13px;color:var(--mut);font-weight:600}
label input,label select,label textarea{margin-top:4px;color:var(--ink);font-weight:400}
small,.mut{color:var(--mut)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.inl{display:flex;gap:6px;align-items:flex-end}
.inl input{flex:1}
.barra{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;margin-bottom:12px}
.barra>*{flex:0 1 auto}
.barra .gr{flex:1 1 200px}
.tabla-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.03em;color:var(--mut);padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:hover td{background:#fafbfe}
.num{text-align:right;white-space:nowrap}
.vacio{text-align:center;color:var(--mut);padding:24px}
.badge{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700}
.b-ok{background:#e6f6ea;color:var(--ok)}.b-warn{background:#fff1e0;color:var(--warn)}.b-bad{background:#fde8ea;color:var(--bad)}.b-gris{background:#eceff5;color:var(--mut)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--rad);padding:14px}
.kpi span{font-size:12px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.kpi b{display:block;font-size:24px;margin-top:6px}
.kpi.oscuro{background:var(--dark);color:#fff;border-color:var(--dark)}
.kpi.oscuro span{color:#aab1e6}
.pos{display:grid;grid-template-columns:1fr 360px;gap:14px;align-items:start}
.scanbar{display:flex;gap:8px;margin-bottom:8px}
.sug{display:flex;flex-direction:column;gap:4px;margin-bottom:8px}
.sug button{text-align:left;background:#f6f8fd;border:1px solid var(--line);border-radius:8px;padding:8px 10px;cursor:pointer}
.sug button:hover{background:#eaefff}
.qty{display:flex;align-items:center;gap:4px}
.qty input{width:64px;text-align:center;padding:6px}
.qty button{width:30px;height:32px;border:1px solid var(--line);background:#fff;border-radius:7px;cursor:pointer;font-size:16px}
input.desc{width:76px;padding:6px}
.cobro .tot{display:flex;justify-content:space-between;padding:5px 0}
.cobro .total{font-size:26px;font-weight:800;border-top:2px solid var(--dark);margin-top:6px;padding-top:10px}
.cobro label{margin-top:10px}
.cambio{margin-top:10px;padding:10px;border-radius:9px;background:#eef2ff;font-weight:700}
.cambio.mal{background:#fde8ea;color:var(--bad)}
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:#fff;padding:8px 14px;border-radius:9px;cursor:pointer;font-weight:600}
.tabs button.act{background:var(--dark);color:#fff;border-color:var(--dark)}
.modal{position:fixed;inset:0;background:rgba(15,18,40,.55);display:flex;align-items:center;justify-content:center;z-index:100;padding:12px}
.modal .caja{background:#fff;border-radius:14px;width:100%;max-height:92vh;display:flex;flex-direction:column;overflow:hidden}
.m-cab{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.m-cab .x{border:0;background:none;font-size:26px;cursor:pointer;line-height:1;color:var(--mut)}
.m-cuerpo{padding:16px 18px;overflow:auto}
.m-pie{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px;border-top:1px solid var(--line)}
#toasts{position:fixed;right:14px;bottom:14px;z-index:200;display:flex;flex-direction:column;gap:8px;max-width:calc(100% - 28px)}
.toast{padding:11px 16px;border-radius:10px;color:#fff;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.toast.ok{background:var(--ok)}.toast.err{background:var(--bad)}.toast.info{background:var(--dark)}
video#camVideo{width:100%;max-height:340px;background:#000;border-radius:10px}
.nota{background:#f1f4fb;border-left:4px solid var(--ac);padding:10px 12px;border-radius:6px;font-size:13px;color:#39415f}
.fila-sep{display:flex;justify-content:space-between;gap:10px;padding:4px 0}
.etiquetas{display:flex;flex-wrap:wrap;gap:6px}
.etq{border:1px dashed #999;padding:6px;width:210px;text-align:center;font-size:12px;page-break-inside:avoid}
.recibo{font-family:"Courier New",monospace;font-size:12px;margin:0 auto;color:#000}
.recibo h2{text-align:center;font-size:15px}
.recibo .c{text-align:center}
.recibo hr{border:0;border-top:1px dashed #000}
.recibo .rl{display:flex;justify-content:space-between;gap:6px}
#printArea{display:none}
@media print{body>*:not(#printArea){display:none!important}#printArea{display:block!important}body{background:#fff}}
@media(max-width:900px){
 #menu{transform:translateX(-100%)}
 #menu.abierto{transform:none;box-shadow:0 0 40px rgba(0,0,0,.4)}
 #main{margin-left:0}
 #btnMenu{display:inline-flex}
 .pos{grid-template-columns:1fr}
 #contenido{padding:12px}
}
@media(max-width:560px){
 .grid2,.grid3{grid-template-columns:1fr}
 .kpi b{font-size:20px}
 th,td{padding:6px 5px}
}
</style>
</head>
<body>
<div id="app">
 <aside id="menu">
  <div class="marca"><span id="menuNegocio">Mi Negocio</span><small>Ventas e Inventario</small></div>
  <nav id="menuNav"></nav>
  <div class="pie">Datos guardados solo en este dispositivo</div>
 </aside>
 <div id="main">
  <header id="topbar">
   <button id="btnMenu" aria-label="Menú" data-act="menu-toggle"></button>
   <h2 id="titulo">Inicio</h2>
   <span id="estadoRed">En línea</span>
  </header>
  <main id="contenido"></main>
 </div>
</div>
<div id="toasts"></div>
<div id="printArea"></div>

<script>
/* =====================================================================
   SISTEMA DE VENTAS E INVENTARIO - archivo único (HTML + CSS + JS)
   Datos operativos: IndexedDB "sistemaVentasDB". Preferencias: localStorage.
   Dependencias externas: ninguna. (Solo si el navegador no tiene
   BarcodeDetector se descarga ZXing desde internet para usar la cámara.)

   FÓRMULAS DE REPORTES
   - Ventas netas      = suma del total de las ventas completadas (ya con descuentos); anuladas excluidas.
   - Costo de ventas   = suma de (cantidad x costo unitario guardado en cada línea de venta).
   - Margen bruto      = Ventas netas - Costo de ventas.
   - Utilidad operativa estimada = Margen bruto - Gastos operativos.
   - Las compras de mercadería NO se restan de las ventas: solo se muestran como información.
   - Efectivo esperado en caja = monto inicial + ventas en efectivo + ingresos - retiros
                                 - gastos en efectivo - compras en efectivo - devoluciones en efectivo.
   ===================================================================== */
'use strict';

/* ---------- Utilidades ---------- */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const r2=n=>Math.round((Number(n)+Number.EPSILON)*100)/100;
const r3=n=>Math.round((Number(n)+Number.EPSILON)*1000)/1000;
const bs=n=>'Bs '+r2(n).toLocaleString('es-BO',{minimumFractionDigits:2,maximumFractionDigits:2});
const q3=n=>String(r3(n));
const pad=n=>String(n).padStart(2,'0');
const ahora=()=>new Date().toISOString();
function uid(p){return p+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,9);}
function num(v){const n=parseFloat(String(v==null?'':v).replace(',','.'));return isFinite(n)?n:NaN;}
function val(id){const e=document.getElementById(id);return e?e.value:'';}
function fechaInput(d=new Date()){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function fmtFecha(iso,hora){
 if(!iso)return '';const d=new Date(iso);if(isNaN(d))return '';
 const dd=pad(d.getDate()),mm=pad(d.getMonth()+1),yy=d.getFullYear();
 let s=CFG.formatoFecha==='yyyy-mm-dd'?yy+'-'+mm+'-'+dd:CFG.formatoFecha==='mm/dd/yyyy'?mm+'/'+dd+'/'+yy:dd+'/'+mm+'/'+yy;
 if(hora)s+=' '+pad(d.getHours())+':'+pad(d.getMinutes());
 return s;
}
function rangoDe(a,b){return {desde:new Date(a+'T00:00:00'),hasta:new Date(b+'T23:59:59.999')};}
function rangoPreset(k){
 const h=new Date(),hoy=fechaInput(h);
 if(k==='semana'){const d=new Date(h);d.setDate(d.getDate()-((d.getDay()+6)%7));return rangoDe(fechaInput(d),hoy);}
 if(k==='mes')return rangoDe(h.getFullYear()+'-'+pad(h.getMonth()+1)+'-01',hoy);
 return rangoDe(hoy,hoy);
}
const enRango=(iso,r)=>{const d=new Date(iso);return d>=r.desde&&d<=r.hasta;};
function toast(msg,tipo='ok'){const t=document.createElement('div');t.className='toast '+tipo;t.textContent=msg;$('#toasts').appendChild(t);setTimeout(()=>t.remove(),tipo==='err'?5200:2600);}
function beep(){try{const c=new (window.AudioContext||window.webkitAudioContext)();const o=c.createOscillator(),g=c.createGain();o.frequency.value=880;g.gain.value=.08;o.connect(g);g.connect(c.destination);o.start();setTimeout(()=>{o.stop();c.close();},110);}catch(e){}}
const csvCell=v=>{if(typeof v==='string'&&/^[=+\-@]/.test(v))v="'"+v;v=String(v==null?'':v);return /[",;\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;};
const aCSV=f=>'\uFEFF'+f.map(r=>r.map(csvCell).join(',')).join('\r\n');
function descargar(nombre,texto,mime='text/csv;charset=utf-8'){const b=new Blob([texto],{type:mime});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=nombre;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},600);}
function parseCSV(t){
 t=t.replace(/^\uFEFF/,'');const first=t.split(/\r?\n/)[0]||'';
 const sep=first.split(';').length>first.split(',').length?';':',';
 const rows=[];let row=[],cur='',q=false;
 for(let i=0;i<t.length;i++){const c=t[i];
  if(q){if(c==='"'){if(t[i+1]==='"'){cur+='"';i++;}else q=false;}else cur+=c;}
  else if(c==='"')q=true;
  else if(c===sep){row.push(cur);cur='';}
  else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;row.push(cur);cur='';rows.push(row);row=[];}
  else cur+=c;}
 if(cur!==''||row.length){row.push(cur);rows.push(row);}
 return rows.filter(r=>r.some(x=>x.trim()!==''));
}
const normH=s=>String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'');
async function hashPin(p){
 try{if(window.crypto&&crypto.subtle){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('sv|'+p));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');}}catch(e){}
 let h=5381;for(const c of 'sv|'+p)h=((h<<5)+h+c.charCodeAt(0))>>>0;return 'x'+h;
}

/* ---------- Configuración (localStorage) ---------- */
const CFG_DEF={negocio:'Mi Negocio',comprobanteTitulo:'RECIBO INTERNO',comprobanteNota:'Gracias por su compra. Este documento no es una factura.',comprobanteDireccion:'',comprobanteTelefono:'',metodosElectronicos:['QR','Tarjeta'],stockNegativo:false,stockMinimoDef:5,descuentoMaxPct:20,formatoFecha:'dd/mm/yyyy',lectorEnter:true,camaraId:'',exigirCaja:false,pinHash:'',anchoTicket:'80'};
let CFG=Object.assign({},CFG_DEF);
function cargarCfg(){try{const s=JSON.parse(localStorage.getItem('sv_config')||'{}');CFG=Object.assign({},CFG_DEF,s);}catch(e){CFG=Object.assign({},CFG_DEF);}}
function guardarCfg(){try{localStorage.setItem('sv_config',JSON.stringify(CFG));}catch(e){toast('No se pudo guardar la configuración','err');}}
const metodosTodos=()=>['Efectivo',...CFG.metodosElectronicos];

/* ---------- Base de datos (IndexedDB) ---------- */
const DB_NAME='sistemaVentasDB',DB_VER=1;
const STORES=['productos','ventas','compras','gastos','cajas','movimientos','proveedores'];
let db=null;
function abrirDB(){return new Promise((res,rej)=>{
 if(!window.indexedDB)return rej(new Error('Este navegador no soporta IndexedDB'));
 const r=indexedDB.open(DB_NAME,DB_VER);
 r.onupgradeneeded=e=>{const d=e.target.result;STORES.forEach(s=>{if(!d.objectStoreNames.contains(s)){const st=d.createObjectStore(s,{keyPath:'id'});if(s==='productos')st.createIndex('codigo','codigo',{unique:true});}});};
 r.onsuccess=()=>{db=r.result;db.onversionchange=()=>{db.close();};res();};
 r.onerror=()=>rej(r.error||new Error('No se pudo abrir la base de datos'));
 r.onblocked=()=>rej(new Error('Base de datos bloqueada: cierra otras pestañas del sistema'));
});}
const reqP=r=>new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});
const getAll=s=>reqP(db.transaction(s).objectStore(s).getAll());
const getOne=(s,id)=>reqP(db.transaction(s).objectStore(s).get(id));
const putOne=(s,o)=>reqP(db.transaction(s,'readwrite').objectStore(s).put(o));
const porCodigo=c=>reqP(db.transaction('productos').objectStore('productos').index('codigo').get(String(c)));
function txDone(tx){return new Promise((res,rej)=>{tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error);tx.onabort=()=>rej(tx.error||new Error('Operación cancelada'));});}
async function enTx(stores,fn){
 const tx=db.transaction(stores,'readwrite');const done=txDone(tx);done.catch(()=>{});
 const S={};stores.forEach(s=>S[s]=tx.objectStore(s));
 try{const r=await fn(S);await done;return r;}catch(e){try{tx.abort();}catch(_){}
  throw (e&&e.name==='QuotaExceededError')?new Error('Almacenamiento lleno en este dispositivo'):e;}
}
function nuevoMov(p,delta,tipo,motivo,ref){
 return {id:uid('m'),fecha:ahora(),productoId:p.id,productoNombre:p.nombre,productoCodigo:p.codigo,tipo,cantidad:r3(delta),stockAntes:r3(p.stock),stockDespues:r3(p.stock+delta),motivo:motivo||'',refTipo:ref?ref.tipo:null,refId:ref?ref.id:null,refNumero:ref?ref.numero:null};
}
function siguienteNumero(lista,pref){let m=0;lista.forEach(x=>{const n=parseInt(String(x.numero||'').replace(/\D/g,''),10);if(n>m)m=n;});return pref+String(m+1).padStart(6,'0');}

/* ---------- Iconos ---------- */
const IC={home:'M3 11l9-8 9 8v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z',cart:'M6 6h15l-2 9H8L6 3H3M9 20h.01M18 20h.01',box:'M21 8l-9-5-9 5v8l9 5 9-5zM3 8l9 5 9-5M12 13v8',list:'M4 6h16M4 12h16M4 18h16',plus:'M12 5v14M5 12h14',hist:'M3 12a9 9 0 1 0 3-6.7M3 4v5h5M12 7v5l3 2',money:'M12 1v22M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6',till:'M3 7h18v13H3zM3 7l3-4h12l3 4M9 13h6',chart:'M4 20V10M10 20V4M16 20v-8M22 20H2',users:'M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8',gear:'M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM19 12h2M3 12h2M12 3v2M12 19v2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4'};
const ico=n=>'<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="'+IC[n]+'"/></svg>';
const NAV=[['inicio','Inicio','home'],['vender','Vender','cart'],['productos','Productos','box'],['inventario','Inventario','list'],['comprar','Comprar','plus'],['historial','Historial','hist'],['gastos','Gastos','money'],['caja','Caja','till'],['reportes','Reportes','chart'],['contactos','Contactos','users'],['config','Configuración','gear']];

/* ---------- Modales ---------- */
function abrirModal({titulo,cuerpo,botones=[],ancho='560px',alCerrar}){
 const ov=document.createElement('div');ov.className='modal';
 ov.innerHTML='<div class="caja" style="max-width:'+ancho+'" role="dialog" aria-modal="true"><div class="m-cab"><h3>'+esc(titulo)+'</h3><button class="x" data-m="cerrar" aria-label="Cerrar">&times;</button></div><div class="m-cuerpo">'+cuerpo+'</div><div class="m-pie"></div></div>';
 const pie=$('.m-pie',ov);
 function cerrar(){if(!ov.isConnected)return;ov.remove();if(alCerrar)alCerrar();}
 botones.forEach(b=>{const e=document.createElement('button');e.type='button';e.className='btn '+(b.clase||'');e.textContent=b.texto;
  e.addEventListener('click',async()=>{
   if(e.disabled)return;e.disabled=true;
   try{if(b.accion){const r=await b.accion(ov);if(r===false){e.disabled=false;return;}}}
   catch(err){toast(err&&err.message?err.message:String(err),'err');console.error(err);e.disabled=false;return;}
   e.disabled=false;cerrar();});
  pie.appendChild(e);});
 if(!botones.length)pie.remove();
 ov.cerrar=cerrar;
 ov.addEventListener('click',e=>{if(e.target===ov||e.target.dataset.m==='cerrar')cerrar();});
 ov.addEventListener('keydown',e=>{if(e.key==='Escape')cerrar();});
 document.body.appendChild(ov);
 const f=$('input:not([type=hidden]):not([disabled]),select,textarea',$('.m-cuerpo',ov));
 if(f&&window.innerWidth>700)f.focus();
 return ov;

/* ---------- Códigos de barras (generación EAN-13 / EAN-8) ---------- */
const EAN_L=['0001101','0011001','0010011','0111101','0100011','0110001','0101111','0111011','0110111','0001011'];
const EAN_G=['0100111','0110011','0011011','0100001','0011101','0111001','0000101','0010001','0001001','0010111'];
const EAN_P=['LLLLLL','LLGLGG','LLGGLG','LLGGGL','LGLLGG','LGGLLG','LGGGLL','LGLGLG','LGLGGL','LGGLGL'];
const inv=s=>s.split('').map(c=>c==='1'?'0':'1').join('');
function ean13Check(d){let s=0;for(let i=0;i<12;i++)s+=(+d[i])*(i%2?3:1);return (10-s%10)%10;}
function ean8Check(d){let s=0;for(let i=0;i<7;i++)s+=(+d[i])*(i%2?1:3);return (10-s%10)%10;}
function modulosBarras(c){
 c=String(c).trim();if(!/^\d+$/.test(c))return null;
 if(c.length===12)c='0'+c;
 if(c.length===13){if(+c[12]!==ean13Check(c.slice(0,12)))return null;const par=EAN_P[+c[0]];let m='101';
  for(let i=1;i<=6;i++)m+=(par[i-1]==='L'?EAN_L:EAN_G)[+c[i]];m+='01010';
  for(let i=7;i<=12;i++)m+=inv(EAN_L[+c[i]]);return {m:m+'101',txt:c};}
 if(c.length===8){if(+c[7]!==ean8Check(c.slice(0,7)))return null;let m='101';
  for(let i=0;i<4;i++)m+=EAN_L[+c[i]];m+='01010';for(let i=4;i<8;i++)m+=inv(EAN_L[+c[i]]);return {m:m+'101',txt:c};}
 return null;
}
function svgBarras(cod,alto=60,mod=2){
 const r=modulosBarras(cod);if(!r)return '';const qz=10,w=(r.m.length+qz*2)*mod;let rects='',i=0;
 while(i<r.m.length){if(r.m[i]==='1'){let j=i;while(j<r.m.length&&r.m[j]==='1')j++;rects+='<rect x="'+((qz+i)*mod)+'" y="0" width="'+((j-i)*mod)+'" height="'+alto+'"/>';i=j;}else i++;}
 return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 '+w+' '+(alto+16)+'" width="'+Math.round(w/1.6)+'" height="'+Math.round((alto+16)/1.6)+'"><rect width="'+w+'" height="'+(alto+16)+'" fill="#fff"/><g fill="#000">'+rects+'</g><text x="'+(w/2)+'" y="'+(alto+13)+'" text-anchor="middle" font-family="monospace" font-size="13">'+esc(r.txt)+'</text></svg>';
}

  const base='200'+String(n).padStart(9,'0');const c=base+ean13Check(base);if(!(await porCodigo(c)))return c;}
 throw new Error('No se pudo generar un código interno');
}

async function buscarProductos(txt){

 return l.filter(p=>p.activo&&((p.nombre||'').toLowerCase().includes(q)||(p.codigo||'').toLowerCase().includes(q)||(p.categoria||'').toLowerCase().includes(q)||(p.marca||'').toLowerCase().includes(q))).sort((a,b)=>a.nombre.localeCompare(b.nombre)).slice(0,8);

async function buscarYAgregar(texto,ctx,origen){
 texto=String(texto||'').trim();if(!texto)return 'vacio';
 const n=Date.now();
 if(origen==='camara'&&ultimoEscaneo.c===texto&&n-ultimoEscaneo.t<1800)return 'rebote';
 if(origen==='teclado'&&ultimoEscaneo.c===texto&&n-ultimoEscaneo.t<150)return 'rebote';
 ultimoEscaneo={c:texto,t:n};
 let p=await porCodigo(texto);
 if(!p){const l=await buscarProductos(texto);
  if(l.length===1)p=l[0];
  else if(l.length>1){mostrarSug(l,ctx);return 'varios';}}
 if(!p){noEncontrado(texto,ctx);return 'no';}
 if(!p.activo){toast('El producto "'+p.nombre+'" está inactivo','err');return 'inactivo';}
 const ok=ctx==='compra'?agregarCompra(p):agregarVenta(p);
 if(ok){beep();limpiarSug(ctx);}
 return ok?'ok':'error';
}

/* ---------- Cámara / escáner ---------- */
const CAM={stream:null,timer:null,busy:false,cb:null};
function detenerCamara(){if(CAM.timer){clearInterval(CAM.timer);CAM.timer=null;}if(CAM.stream){CAM.stream.getTracks().forEach(t=>t.stop());CAM.stream=null;}const v=$('#camVideo');if(v)v.srcObject=null;}
function cargarScript(url){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=url;s.onload=res;s.onerror=()=>rej(new Error('No se pudo descargar la biblioteca de escaneo (se necesita Internet la primera vez)'));document.head.appendChild(s);});}
async function iniciarCamara(deviceId){
 const est=$('#camEstado');detenerCamara();
 if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){est.textContent='Este navegador no permite usar la cámara. Usa el ingreso manual.';return;}
 if(!window.isSecureContext){est.textContent='La cámara requiere HTTPS o localhost. Abre el sistema desde una dirección segura o usa el ingreso manual.';return;}
 est.textContent='Solicitando permiso de cámara...';
 try{
  const c={audio:false,video:deviceId?{deviceId:{exact:deviceId}}:{facingMode:{ideal:'environment'}}};
  try{CAM.stream=await navigator.mediaDevices.getUserMedia(c);}
  catch(err){if(deviceId&&(err.name==='OverconstrainedError'||err.name==='NotFoundError')){CAM.stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'}}});}else throw err;}
 }catch(err){
  est.textContent=err.name==='NotAllowedError'?'Permiso de cámara denegado. Habilítalo en el navegador y pulsa "Reintentar".':err.name==='NotFoundError'?'No se encontró ninguna cámara.':err.name==='NotReadableError'?'La cámara está siendo usada por otra aplicación.':'No se pudo abrir la cámara: '+(err.message||err.name);return;}
 const v=$('#camVideo');if(!v){detenerCamara();return;}
 v.srcObject=CAM.stream;try{await v.play();}catch(e){}
 try{const devs=(await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==='videoinput');const sel=$('#camSel');
  if(sel){const act=CAM.stream.getVideoTracks()[0].getSettings().deviceId;sel.innerHTML=devs.map((d,i)=>'<option value="'+esc(d.deviceId)+'"'+(d.deviceId===act?' selected':'')+'>'+esc(d.label||'Cámara '+(i+1))+'</option>').join('');}}catch(e){}
 let decod;
 try{
  if('BarcodeDetector' in window){
   const want=['ean_13','ean_8','upc_a','upc_e','code_128'];let fm=want;
   try{const sup=await BarcodeDetector.getSupportedFormats();fm=want.filter(f=>sup.includes(f));}catch(e){}
   const det=new BarcodeDetector({formats:fm});
   decod=async vid=>{const r=await det.detect(vid);return r.length?r[0].rawValue:null;};
  }else{
   est.textContent='Cargando biblioteca de escaneo...';
   if(!window.ZXing)await cargarScript('https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js');
   const Z=window.ZXing,h=new Map();
   h.set(Z.DecodeHintType.POSSIBLE_FORMATS,[Z.BarcodeFormat.EAN_13,Z.BarcodeFormat.EAN_8,Z.BarcodeFormat.UPC_A,Z.BarcodeFormat.UPC_E,Z.BarcodeFormat.CODE_128]);
   h.set(Z.DecodeHintType.TRY_HARDER,true);
   const rd=new Z.MultiFormatReader();rd.setHints(h);const cv=document.createElement('canvas');
   decod=async vid=>{cv.width=vid.videoWidth;cv.height=vid.videoHeight;cv.getContext('2d').drawImage(vid,0,0);
    try{return rd.decode(new Z.BinaryBitmap(new Z.HybridBinarizer(new Z.HTMLCanvasElementLuminanceSource(cv)))).getText();}catch(e){return null;}};
  }
 }catch(err){est.textContent=err.message||'No se pudo iniciar el lector de códigos. Usa el ingreso manual.';return;}
 est.textContent='Apunta al código de barras...';
 CAM.timer=setInterval(async()=>{
  if(CAM.busy||!v.videoWidth)return;CAM.busy=true;
  try{const cod=await decod(v);if(cod&&CAM.cb)await CAM.cb(cod);}catch(e){}finally{CAM.busy=false;}
 },250);
}

async function importarProductosCSV(texto){
 const filas=parseCSV(texto);if(filas.length<2)throw new Error('El CSV está vacío o solo tiene encabezado');
 const H=filas[0].map(normH);const alias={codigo:['codigo','barcode','codigo_de_barras'],nombre:['nombre','producto'],descripcion:['descripcion'],categoria:['categoria'],marca:['marca'],costo:['costo','precio_costo','precio_de_costo'],precio:['precio','precio_venta','precio_de_venta'],stock:['stock','cantidad'],minimo:['stock_minimo','minimo'],unidad:['unidad'],vencimiento:['vencimiento','fecha_vencimiento'],activo:['activo']};
 const idx={};Object.keys(alias).forEach(k=>{idx[k]=H.findIndex(h=>alias[k].includes(h));});
 if(idx.nombre<0)throw new Error('El CSV necesita al menos la columna "nombre"');
 const exist=new Set((await getAll('productos')).map(p=>p.codigo));const vistos=new Set();const buenos=[],errores=[];let dup=0;
 const g=(r,k)=>idx[k]>=0?String(r[idx[k]]==null?'':r[idx[k]]).trim():'';
 for(let i=1;i<filas.length;i++){const r=filas[i];const nombre=g(r,'nombre');
  if(!nombre){errores.push('Fila '+(i+1)+': falta el nombre');continue;}
  const costo=g(r,'costo')===''?0:num(g(r,'costo')),precio=g(r,'precio')===''?0:num(g(r,'precio')),stock=g(r,'stock')===''?0:num(g(r,'stock')),min=g(r,'minimo')===''?CFG.stockMinimoDef:num(g(r,'minimo'));
  if([costo,precio,stock,min].some(x=>isNaN(x)||x<0)){errores.push('Fila '+(i+1)+': valores numéricos inválidos');continue;}
  let codigo=g(r,'codigo');
  if(codigo&&(exist.has(codigo)||vistos.has(codigo))){dup++;continue;}
  if(!codigo)codigo=await codigoInterno();vistos.add(codigo);
  const t=ahora();
  buenos.push({id:uid('p'),codigo,nombre,descripcion:g(r,'descripcion'),categoria:g(r,'categoria'),marca:g(r,'marca'),costo:r2(costo),precio:r2(precio),stock:r3(stock),stockMinimo:r3(min),unidad:g(r,'unidad')||'unidad',vencimiento:g(r,'vencimiento'),activo:!/^(no|0|false|inactivo)$/i.test(g(r,'activo')),creado:t,actualizado:t});}
 if(buenos.length){await enTx(['productos','movimientos'],async S=>{buenos.forEach(p=>{S.productos.put(p);if(p.stock>0)S.movimientos.put(nuevoMov({...p,stock:0},p.stock,'entrada','Importación CSV (stock inicial)',null));});});}
 abrirModal({titulo:'Resultado de la importación',ancho:'480px',cuerpo:'<p><b>'+buenos.length+'</b> productos importados.<br><b>'+dup+'</b> omitidos por código duplicado.<br><b>'+errores.length+'</b> filas con errores.</p>'+(errores.length?'<div class="nota">'+errores.slice(0,10).map(esc).join('<br>')+(errores.length>10?'<br>...':'')+'</div>':''),botones:[{texto:'Aceptar',clase:'pri'}]});
 refrescar();
}

async function ajustarStock(id,tipo,valor,motivo){
 return enTx(['productos','movimientos'],async S=>{
  const p=await reqP(S.productos.get(id));if(!p)throw new Error('Producto no encontrado');
  const delta=tipo==='entrada'?valor:tipo==='salida'?-valor:r3(valor-p.stock);
  if(delta===0)throw new Error('El ajuste no cambia el stock');
  const nuevo=r3(p.stock+delta);if(nuevo<0&&!CFG.stockNegativo)throw new Error('El stock no puede quedar negativo (stock actual: '+q3(p.stock)+')');
  S.movimientos.put(nuevoMov(p,delta,tipo,motivo,null));p.stock=nuevo;p.actualizado=ahora();S.productos.put(p);});
}

 const el=CFG.metodosElectronicos.map((m,i)=>{const e=document.querySelector('.pvElec[data-k="'+i+'"]');const v=e?num(e.value):0;return {metodo:m,monto:isNaN(v)||v<0?0:r2(v)};});
 const otros=r2(el.reduce((a,x)=>a+x.monto,0));const aplicado=r2(t.total-otros);
 let rec=num(val('pvEfectivo'));const vacio=val('pvEfectivo').trim()==='';if(vacio||isNaN(rec))rec=aplicado>0?aplicado:0;
 return {electr:el,otros,aplicado,recibido:r2(rec),cambio:r2(rec-aplicado),exceso:aplicado<0,falta:aplicado>0&&r2(rec)<aplicado};
}

 const p=calcPago(t),c=$('#pvCambio');
 if(!carrito.length){c.className='cambio';c.textContent='Cambio: '+bs(0);return;}
 if(p.exceso){c.className='cambio mal';c.textContent='Los pagos electrónicos superan el total';}
 else if(p.falta){c.className='cambio mal';c.textContent='Falta: '+bs(p.aplicado-p.recibido);}
 else{c.className='cambio';c.textContent='Cambio: '+bs(p.cambio);}
}

async function guardarVenta(lineas,t,pagos,p){
 const cajas=await getAll('cajas');const caja=cajas.find(c=>c.estado==='abierta');
 if(CFG.exigirCaja&&!caja)throw new Error('Debes abrir la caja antes de vender');
 return enTx(['productos','ventas','movimientos'],async S=>{
  const todas=await reqP(S.ventas.getAll());const numero=siguienteNumero(todas,'V-');
  const venta={id:uid('v'),numero,fecha:ahora(),items:[],subtotal:t.sub,descuentoGeneral:t.dg,total:t.total,pagos,recibido:p.recibido,cambio:Math.max(0,p.cambio),estado:'completada',cajaId:caja?caja.id:null};
  const ref={tipo:'venta',id:venta.id,numero};
  for(const l of lineas){
   const pr=await reqP(S.productos.get(l.id));
   if(!pr)throw new Error('El producto "'+l.nombre+'" ya no existe');
   if(!pr.activo)throw new Error('El producto "'+pr.nombre+'" está inactivo');
   const nuevo=r3(pr.stock-l.cantidad);
   if(nuevo<0&&!CFG.stockNegativo)throw new Error('Stock insuficiente de "'+pr.nombre+'" (disponible: '+q3(pr.stock)+')');
   venta.items.push({productoId:pr.id,codigo:pr.codigo,nombre:pr.nombre,cantidad:l.cantidad,precio:l.precio,costo:pr.costo,descuento:l.desc||0,subtotal:r2(l.precio*l.cantidad-(l.desc||0))});
   S.movimientos.put(nuevoMov(pr,-l.cantidad,'venta','Venta '+numero,ref));
   pr.stock=nuevo;pr.actualizado=ahora();S.productos.put(pr);
  }
  S.ventas.put(venta);return venta;});
}

  if(esV)await anularVenta(x.id,mot);else await anularCompra(x.id,mot);
  toast('Anulado correctamente. Stock revertido con movimientos inversos.');refrescar();}});

};
async function anularVenta(id,motivo){
 return enTx(['productos','ventas','movimientos'],async S=>{
  const v=await reqP(S.ventas.get(id));if(!v)throw new Error('Venta no encontrada');if(v.estado!=='completada')throw new Error('La venta ya está anulada');
  const ref={tipo:'anulacion_venta',id:v.id,numero:v.numero};
  for(const i of v.items){const p=await reqP(S.productos.get(i.productoId));if(!p)continue;
   S.movimientos.put(nuevoMov(p,i.cantidad,'anulacion_venta','Anulación de '+v.numero+': '+motivo,ref));p.stock=r3(p.stock+i.cantidad);p.actualizado=ahora();S.productos.put(p);}
  v.estado='anulada';v.motivoAnulacion=motivo;v.fechaAnulacion=ahora();S.ventas.put(v);});
}
async function anularCompra(id,motivo){
 return enTx(['productos','compras','movimientos'],async S=>{
  const c=await reqP(S.compras.get(id));if(!c)throw new Error('Compra no encontrada');if(c.estado!=='completada')throw new Error('La compra ya está anulada');
  const ref={tipo:'anulacion_compra',id:c.id,numero:c.numero};const ps=[];
  for(const i of c.items){const p=await reqP(S.productos.get(i.productoId));if(!p)continue;
   if(p.stock<i.cantidad)throw new Error('No se puede anular: el stock actual de "'+p.nombre+'" ('+q3(p.stock)+') es menor a lo comprado ('+q3(i.cantidad)+')');ps.push([p,i]);}
  for(const [p,i] of ps){S.movimientos.put(nuevoMov(p,-i.cantidad,'anulacion_compra','Anulación de '+c.numero+': '+motivo,ref));p.stock=r3(p.stock-i.cantidad);p.actualizado=ahora();S.productos.put(p);}
  c.estado='anulada';c.motivoAnulacion=motivo;c.fechaAnulacion=ahora();S.compras.put(c);});
}

async function calcCaja(c){
 const rg={desde:new Date(c.fechaApertura),hasta:c.fechaCierre?new Date(c.fechaCierre):new Date()};
 const [ventas,compras,gastos]=await Promise.all([getAll('ventas'),getAll('compras'),getAll('gastos')]);
 const por={};let efVentas=0,dev=0;
 ventas.forEach(v=>{
  if(v.estado==='completada'&&enRango(v.fecha,rg))v.pagos.forEach(p=>{por[p.metodo]=r2((por[p.metodo]||0)+p.monto);if(p.metodo==='Efectivo')efVentas=r2(efVentas+p.monto);});
  if(v.estado==='anulada'&&v.fechaAnulacion&&enRango(v.fechaAnulacion,rg)&&!enRango(v.fecha,rg))v.pagos.forEach(p=>{if(p.metodo==='Efectivo')dev=r2(dev+p.monto);});});
 const ing=r2((c.movimientos||[]).filter(m=>m.tipo==='ingreso').reduce((a,m)=>a+m.monto,0));
 const ret=r2((c.movimientos||[]).filter(m=>m.tipo==='retiro').reduce((a,m)=>a+m.monto,0));
 const gEf=r2(gastos.filter(g=>g.metodoPago==='Efectivo'&&enRango(g.fecha,rg)).reduce((a,g)=>a+g.importe,0));
 const cEf=r2(compras.filter(x=>x.estado==='completada'&&x.metodoPago==='Efectivo'&&enRango(x.fecha,rg)).reduce((a,x)=>a+x.total,0));
 return {por,efVentas,dev,ing,ret,gEf,cEf,esperado:r2(c.montoInicial+efVentas+ing-ret-gEf-cEf-dev)};
}

const RF={preset:'mes',desde:'',hasta:''};
async function datosReporte(){
 const r=RF.preset==='custom'&&RF.desde&&RF.hasta?rangoDe(RF.desde,RF.hasta):rangoPreset(RF.preset==='custom'?'mes':RF.preset);
 if(RF.preset!=='custom'){RF.desde=fechaInput(r.desde);RF.hasta=fechaInput(r.hasta);}
 const [ventas,compras,gastos,movs,prods]=await Promise.all([getAll('ventas'),getAll('compras'),getAll('gastos'),getAll('movimientos'),getAll('productos')]);
 const vc=ventas.filter(v=>v.estado==='completada'&&enRango(v.fecha,r));const va=ventas.filter(v=>v.estado==='anulada'&&enRango(v.fecha,r));
 const bruto=r2(vc.reduce((a,v)=>a+v.items.reduce((b,i)=>b+i.precio*i.cantidad,0),0));
 const netas=r2(vc.reduce((a,v)=>a+v.total,0));
 const costo=r2(vc.reduce((a,v)=>a+v.items.reduce((b,i)=>b+i.costo*i.cantidad,0),0));
 const gOp=r2(gastos.filter(g=>enRango(g.fecha,r)).reduce((a,g)=>a+g.importe,0));
 const cMer=r2(compras.filter(c=>c.estado==='completada'&&enRango(c.fecha,r)).reduce((a,c)=>a+c.total,0));
 const unidades=r3(vc.reduce((a,v)=>a+v.items.reduce((b,i)=>b+i.cantidad,0),0));
 const mapa={};vc.forEach(v=>v.items.forEach(i=>{const m=mapa[i.productoId]||(mapa[i.productoId]={nombre:i.nombre,u:0,ventas:0,costo:0});m.u=r3(m.u+i.cantidad);m.ventas=r2(m.ventas+i.subtotal);m.costo=r2(m.costo+i.costo*i.cantidad);}));
 const top=Object.values(mapa).sort((a,b)=>b.u-a.u).slice(0,10);
 const pagos={};vc.forEach(v=>v.pagos.forEach(p=>{pagos[p.metodo]=r2((pagos[p.metodo]||0)+p.monto);}));
 return {r,vc,va,bruto,netas,desc:r2(bruto-netas),costo,margen:r2(netas-costo),gOp,cMer,utilidad:r2(netas-costo-gOp),unidades,top,pagos,movs:movs.filter(m=>enRango(m.fecha,r)).sort((a,b)=>b.fecha.localeCompare(a.fecha)),bajos:prods.filter(p=>p.activo&&p.stock<=p.stockMinimo)};
}

/* ---------- INICIO ---------- */
async function VISTA_inicio(){
 const [ventas,prods,gastos]=await Promise.all([getAll('ventas'),getAll('productos'),getAll('gastos')]);
 const hoy=rangoPreset('dia');const vh=ventas.filter(v=>v.estado==='completada'&&enRango(v.fecha,hoy));
 const total=r2(vh.reduce((a,v)=>a+v.total,0));const uni=r3(vh.reduce((a,v)=>a+v.items.reduce((b,i)=>b+i.cantidad,0),0));
 const costo=r2(vh.reduce((a,v)=>a+v.items.reduce((b,i)=>b+i.costo*i.cantidad,0),0));
 const gH=r2(gastos.filter(g=>enRango(g.fecha,hoy)).reduce((a,g)=>a+g.importe,0));
 const act=prods.filter(p=>p.activo);const bajos=act.filter(p=>p.stock>0&&p.stock<=p.stockMinimo),ago=act.filter(p=>p.stock<=0);
 const ult=ventas.slice().sort((a,b)=>b.fecha.localeCompare(a.fecha)).slice(0,8);
 const html='<div class="barra"><button class="btn pri" data-act="nav" data-v="vender">Ir al punto de venta</button><button class="btn sec" data-act="nav" data-v="inventario">Inventario</button><button class="btn sec" data-act="nav" data-v="productos">Productos</button></div>'
 +'<div class="kpis"><div class="kpi oscuro"><span>Ventas del día</span><b>'+bs(total)+'</b></div><div class="kpi"><span>Nº de ventas</span><b>'+vh.length+'</b></div><div class="kpi"><span>Unidades vendidas</span><b>'+q3(uni)+'</b></div><div class="kpi"><span>Ganancia bruta estimada</span><b>'+bs(total-costo)+'</b></div><div class="kpi"><span>Gastos del día</span><b>'+bs(gH)+'</b></div><div class="kpi"><span>Stock bajo</span><b>'+bajos.length+'</b></div><div class="kpi"><span>Agotados</span><b>'+ago.length+'</b></div></div>'
 +'<div class="grid2"><div class="card"><h3>Productos con poco stock</h3><div class="tabla-wrap"><table><thead><tr><th>Producto</th><th class="num">Stock</th><th>Estado</th></tr></thead><tbody>'+(ago.concat(bajos).slice(0,12).map(p=>{const e=estadoStock(p);return '<tr><td>'+esc(p.nombre)+'</td><td class="num">'+q3(p.stock)+'</td><td><span class="badge '+e[1]+'">'+e[0]+'</span></td></tr>';}).join('')||'<tr><td colspan="3" class="vacio">Sin alertas de stock</td></tr>')+'</tbody></table></div></div>'
 +'<div class="card"><h3>Últimas ventas</h3><div class="tabla-wrap"><table><thead><tr><th>N°</th><th>Fecha</th><th class="num">Total</th><th>Estado</th></tr></thead><tbody>'+(ult.map(v=>'<tr><td>'+esc(v.numero)+'</td><td>'+fmtFecha(v.fecha,true)+'</td><td class="num">'+bs(v.total)+'</td><td><span class="badge '+(v.estado==='completada'?'b-ok':'b-bad')+'">'+(v.estado==='completada'?'Completada':'Anulada')+'</span></td></tr>').join('')||'<tr><td colspan="4" class="vacio">Aún no hay ventas</td></tr>')+'</tbody></table></div></div></div>'
 +(act.length?'':'<div class="nota">Empieza registrando tus productos en <b>Productos → Nuevo producto</b> (o importa un CSV) y luego abre la caja.</div>');
 return {html};
}

 +'<div class="barra" style="margin-top:12px"><button class="btn pri" data-act="cf-guardar">Guardar configuración</button><button class="btn sec" data-act="cf-cam">Olvidar cámara preferida</button></div></div>'
 +'<div class="card"><h3>Copias de seguridad</h3><div class="nota" style="margin-bottom:12px">Tus datos viven solo en este dispositivo y navegador. Se pueden perder si borras los datos del navegador, se daña el equipo o se reinstala. <b>Haz copias periódicas</b> y guárdalas fuera del dispositivo. La copia JSON <b>no está cifrada</b>.</div><div class="barra"><button class="btn pri" data-act="bk-export">Exportar copia (JSON)</button><button class="btn sec" data-act="bk-import">Restaurar copia</button><input type="file" id="bkFile" accept=".json,application/json" hidden data-act="bk-file"><button class="btn sec" data-act="pr-export">Exportar productos CSV</button></div></div>'
 +'<div class="card"><h3>Zona de riesgo</h3><p class="mut">Borra todos los productos, ventas, compras, gastos, cajas y movimientos de este dispositivo.</p><button class="btn bad" data-act="bk-borrar">Borrar todos los datos</button></div>'

ACC['cf-guardar']=async()=>{
 const met=val('cfMet').split(',').map(s=>s.trim()).filter(s=>s&&s.toLowerCase()!=='efectivo');
 const mn=num(val('cfMin')),dm=num(val('cfDesc'));if(isNaN(mn)||mn<0)throw new Error('Stock mínimo inválido');if(isNaN(dm)||dm<0||dm>100)throw new Error('El descuento máximo debe estar entre 0 y 100');
 CFG.negocio=val('cfNeg').trim()||'Mi Negocio';CFG.comprobanteDireccion=val('cfDir').trim();CFG.comprobanteTelefono=val('cfTel').trim();CFG.comprobanteTitulo=val('cfTit').trim()||'RECIBO INTERNO';CFG.anchoTicket=val('cfAn');CFG.comprobanteNota=val('cfNota').trim();
 CFG.metodosElectronicos=[...new Set(met)];CFG.stockMinimoDef=mn;CFG.descuentoMaxPct=dm;CFG.formatoFecha=val('cfFec');CFG.stockNegativo=$('#cfNeg2').checked;CFG.exigirCaja=$('#cfEx').checked;CFG.lectorEnter=$('#cfEnter').checked;
 const pin=val('cfPin');if(pin)CFG.pinHash=await hashPin(pin);if($('#cfQuitaPin')&&$('#cfQuitaPin').checked)CFG.pinHash='';
 guardarCfg();pintarMenu();toast('Configuración guardada');refrescar();
};
ACC['cf-cam']=()=>{CFG.camaraId='';guardarCfg();toast('Cámara preferida olvidada');};
ACC['bk-export']=async()=>{
 const stores={};for(const s of STORES)stores[s]=await getAll(s);
 const data={app:'sistema-ventas',version:1,fecha:ahora(),stores,config:CFG};
 descargar('copia_seguridad_'+fechaInput()+'.json',JSON.stringify(data),'application/json');toast('Copia exportada. Guárdala en un lugar seguro.');
};
ACC['bk-import']=()=>$('#bkFile').click();
CHG['bk-file']=async el=>{
 const f=el.files[0];el.value='';if(!f)return;
 let d;try{d=JSON.parse(await f.text());}catch(e){throw new Error('El archivo no es un JSON válido');}
 if(!d||d.app!=='sistema-ventas'||!d.stores||typeof d.stores!=='object')throw new Error('El archivo no es una copia de este sistema');
 for(const s of STORES){if(!Array.isArray(d.stores[s]))throw new Error('Copia incompleta: falta "'+s+'"');if(d.stores[s].some(x=>!x||typeof x.id!=='string'))throw new Error('Copia dañada: registros sin id en "'+s+'"');}
 const cods=d.stores.productos.map(p=>p.codigo);if(new Set(cods).size!==cods.length)throw new Error('Copia inconsistente: códigos de producto duplicados');
 const res=STORES.map(s=>s+': '+d.stores[s].length).join(', ');
 if(!(await confirmar('Se REEMPLAZARÁN todos los datos actuales por los de la copia ('+fmtFecha(d.fecha,true)+'). Contenido: '+res+'. ¿Continuar?','Reemplazar datos',true)))return;
 await enTx(STORES,async S=>{STORES.forEach(s=>{S[s].clear();d.stores[s].forEach(r=>S[s].put(r));});});
 if(d.config&&typeof d.config==='object'){CFG=Object.assign({},CFG_DEF,d.config);guardarCfg();}
 carrito=[];carritoC=[];pintarMenu();toast('Copia restaurada correctamente');refrescar();
};
ACC['bk-borrar']=async()=>{
 if(!(await confirmar('Se borrarán TODOS los datos de este dispositivo. Esta acción no se puede deshacer. ¿Continuar?','Continuar',true)))return;
 const t=await pedirTexto('Confirmación final','Escribe BORRAR para confirmar.',{multilinea:false});if(t!=='BORRAR'){toast('Cancelado','info');return;}
 await enTx(STORES,async S=>{STORES.forEach(s=>S[s].clear());});carrito=[];carritoC=[];toast('Datos borrados');refrescar();
};

/* ---------- Vistas y arranque ---------- */
const VISTAS={inicio:VISTA_inicio,vender:VISTA_vender,productos:VISTA_productos,inventario:VISTA_inventario,comprar:VISTA_comprar,historial:VISTA_historial,gastos:VISTA_gastos,caja:VISTA_caja,reportes:VISTA_reportes,contactos:VISTA_contactos,config:VISTA_config};
async function iniciar(){
 cargarCfg();estadoRed();
 try{await abrirDB();}
 catch(e){$('#contenido').innerHTML='<div class="card"><h3>No se pudo iniciar la base de datos</h3><p>'+esc(e.message||e)+'</p><p class="mut">Si usas modo privado o un navegador sin IndexedDB, el sistema no puede guardar datos.</p></div>';return;}
 try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
 const v=location.hash.replace('#/','');vista='';await navegar(VISTAS[v]?v:'inicio',true);
}
iniciar();
